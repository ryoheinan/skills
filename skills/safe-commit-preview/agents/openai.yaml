interface:
  display_name: "Safe Commit Preview"
  short_description: "Plan reviewable commit boundaries and preview them before committing"
  icon_small: "./assets/icon-small.png"
  icon_large: "./assets/icon-large.png"
  brand_color: "#0F766E"
  default_prompt: "Use $safe-commit-preview to plan reviewable commit boundaries for my local changes, show me a preview first, and commit only if I explicitly ask."

policy:
  allow_implicit_invocation: true
